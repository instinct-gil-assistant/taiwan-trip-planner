<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173b37"><title>הטיול שלנו לטאיוואן</title><style>:root{--ink:#173b37;--muted:#617571;--bg:#f5f3ec;--card:#fff;--accent:#ed6a5a;--line:#dfe6e2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}header{background:var(--ink);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:24px;margin:3px 0}small{opacity:.75}button{font:inherit;border:0;cursor:pointer}.ghost{border:1px solid #ffffff55;background:transparent;color:#fff;border-radius:12px;padding:9px 11px}main{max-width:760px;margin:auto;padding:18px 14px 100px}.hero{background:linear-gradient(135deg,#d9efe9,#fff);padding:15px;border-radius:18px}.hero p{margin:0 0 8px;line-height:1.45}.hero #status{font-size:13px;color:var(--muted)}nav{display:flex;gap:8px;overflow-x:auto;padding:18px 1px 10px;scrollbar-width:none}nav button{white-space:nowrap;background:#e6e9e5;color:var(--ink);padding:10px 14px;border-radius:999px}nav button.active{background:var(--ink);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 4px 18px #173b370d}.card-head{display:flex;gap:8px}.title{font-size:18px;font-weight:700;flex:1;border:0;border-bottom:1px solid transparent;padding:5px 2px;color:var(--ink)}.details{width:100%;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:12px;resize:vertical;font:inherit;line-height:1.45;color:#263d39}.danger{background:#fff0ee;color:#b84435;border-radius:50%;width:32px;height:32px;font-size:22px}.meta{font-size:12px;color:var(--muted);margin-top:7px}.fab{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom));background:var(--accent);color:#fff;padding:14px 18px;border-radius:999px;font-weight:700;box-shadow:0 8px 24px #9b3c3055}.empty{text-align:center;color:var(--muted);padding:42px 12px}@media(min-width:700px){h1{font-size:30px}.fab{left:calc(50% - 350px)}}
</style></head><body>
<header><div><small>גיל + דנה</small><h1>הטיול שלנו לטאיוואן 🇹🇼</h1></div><button id="exportBtn" class="ghost">ייצוא גיבוי</button></header>
<main><section class="hero"><p>כל מה שצריך לטיול, במקום אחד. השינויים נשמרים ומשותפים לשניכם.</p><div id="status">מתחבר...</div></section>
<nav id="tabs"></nav><section id="content"></section>
</main>
<template id="cardTemplate"><article class="card"><div class="card-head"><input class="title" aria-label="כותרת"><button class="danger" aria-label="מחיקה">×</button></div><textarea class="details" rows="4" aria-label="פרטים" placeholder="הוסיפו פרטים, כתובות, קישורים ושעות..."></textarea><div class="meta"></div></article></template>
<button id="addBtn" class="fab">＋ הוספה</button><script>const CONFIG={supabaseUrl:'REPLACE_SUPABASE_URL',supabaseAnonKey:'REPLACE_SUPABASE_ANON_KEY',tripId:'taiwan-gil-dana'};
const sections=[['flights','✈️ טיסות'],['hotels','🏨 מלונות'],['itinerary','🗓️ מסלול יומי'],['places','🍜 אוכל ומקומות'],['notes','📝 הערות']];let active='flights',items=[],timer;
const $=s=>document.querySelector(s),status=$('#status');
function headers(){return {'apikey':CONFIG.supabaseAnonKey,'Authorization':'Bearer '+CONFIG.supabaseAnonKey,'Content-Type':'application/json','Prefer':'return=representation'}}
async function load(){if(CONFIG.supabaseUrl.startsWith('REPLACE')){status.textContent='מצב הדגמה - יש להשלים הגדרת מסד נתונים';items=seed();render();return}try{let r=await fetch(`${CONFIG.supabaseUrl}/rest/v1/trip_items?trip_id=eq.${CONFIG.tripId}&order=position.asc`,{headers:headers()});if(!r.ok)throw Error();items=await r.json();status.textContent='מחובר • השינויים נשמרים אוטומטית';render()}catch{status.textContent='אין חיבור כרגע • נסו לרענן'}}
function seed(){return sections.flatMap(([section,label],i)=>[{id:crypto.randomUUID(),trip_id:CONFIG.tripId,section,title:i===0?'פרטי '+label:'',details:'',position:0,updated_at:new Date().toISOString()}])}
function tabs(){let n=$('#tabs');n.innerHTML='';sections.forEach(([id,label])=>{let b=document.createElement('button');b.textContent=label;b.className=id===active?'active':'';b.onclick=()=>{active=id;render()};n.append(b)})}
function render(){tabs();let c=$('#content');c.innerHTML='';let list=items.filter(x=>x.section===active);if(!list.length)c.innerHTML='<div class="empty">עוד אין כאן פריטים. לחצו על הוספה.</div>';list.forEach(x=>{let el=$('#cardTemplate').content.cloneNode(true),title=el.querySelector('.title'),details=el.querySelector('.details');title.value=x.title||'';details.value=x.details||'';el.querySelector('.meta').textContent=x.updated_by?`עודכן על ידי ${x.updated_by}`:'';const change=()=>{x.title=title.value;x.details=details.value;queueSave(x)};title.oninput=change;details.oninput=change;el.querySelector('.danger').onclick=()=>remove(x);c.append(el)})}
function queueSave(x){status.textContent='שומר...';clearTimeout(timer);timer=setTimeout(()=>save(x),500)}
async function save(x){x.updated_at=new Date().toISOString();if(CONFIG.supabaseUrl.startsWith('REPLACE')){status.textContent='נשמר במצב הדגמה';return}let r=await fetch(`${CONFIG.supabaseUrl}/rest/v1/trip_items?on_conflict=id`,{method:'POST',headers:headers(),body:JSON.stringify(x)});status.textContent=r.ok?'נשמר ✓':'השמירה נכשלה'}
async function remove(x){if(!confirm('למחוק את הפריט?'))return;items=items.filter(i=>i.id!==x.id);render();if(!CONFIG.supabaseUrl.startsWith('REPLACE'))await fetch(`${CONFIG.supabaseUrl}/rest/v1/trip_items?id=eq.${x.id}`,{method:'DELETE',headers:headers()})}
$('#addBtn').onclick=()=>{let x={id:crypto.randomUUID(),trip_id:CONFIG.tripId,section:active,title:'פריט חדש',details:'',position:items.filter(i=>i.section===active).length,updated_at:new Date().toISOString()};items.push(x);render();save(x)};
$('#exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,exported_at:new Date().toISOString(),items},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='taiwan-trip-backup.json';a.click()};
load();setInterval(load,15000);
</script></body></html>
